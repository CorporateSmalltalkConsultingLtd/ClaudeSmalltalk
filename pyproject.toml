[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-smalltalk"
version = "3.0.0"
description = "MCP server for AI interaction with live Smalltalk images (Squeak and Cuis)"
readme = "CLAUDE-README-MCPB.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Corporate Smalltalk Consulting Ltd"}
]
keywords = [
    "mcp",
    "smalltalk",
    "cuis",
    "squeak",
    "claude",
    "ai",
    "llm",
    "model-context-protocol"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
mqtt = ["paho-mqtt>=2.0.0"]
openai = ["openai>=1.0.0"]
all = ["anthropic>=0.40.0", "openai>=1.0.0", "paho-mqtt>=2.0.0"]

[project.urls]
Homepage = "https://github.com/CorporateSmalltalkConsultingLtd/ClaudeSmalltalk"
Repository = "https://github.com/CorporateSmalltalkConsultingLtd/ClaudeSmalltalk"

[tool.hatch.build.targets.sdist]
exclude = [".mcpregistry*", "mcp-publisher", "*.image", "*.changes"]

[tool.hatch.build.targets.wheel]
# Note: smalltalk_agent_mcp.py and smalltalk_agent.py are standalone scripts
# run via `uv run`, not installable packages.
